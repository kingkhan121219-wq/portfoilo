<!-- Embed Google Fonts in your <head> if not already present -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">

<!-- CSS Styles -->
<style>
  .banner-typography {
    background: linear-gradient(90deg, #17110c 0%, #291c10 100%);
    padding: 1.25rem 2rem;
    border-radius: 8px;
    display: inline-block;
    box-sizing: border-box;
    user-select: none;
  }

  .banner-script-line {
    font-family: 'Alex Brush', cursive;
    color: #df8f3b;
    font-size: 3.25rem;
    line-height: 1;
    margin: 0 0 0.2rem 0;
    font-weight: 400;
    letter-spacing: 0.02em;
  }

  .banner-serif-line {
    font-family: 'Playfair Display', serif;
    font-size: 2.75rem;
    font-weight: 700;
    line-height: 1.1;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .banner-serif-white {
    color: #fbf6ee;
  }

  .banner-serif-gold-italic {
    color: #df8f3b;
    font-style: italic;
  }
</style>

<!-- HTML Markup -->
<div class="banner-typography">
  <div class="banner-script-line">Decorative</div>
  <div class="banner-serif-line">
    <span class="banner-serif-white">Leaf Shape MDF </span>
    <span class="banner-serif-gold-italic">Table Lamp</span>
  </div>
</div>
